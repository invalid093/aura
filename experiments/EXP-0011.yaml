notes: >
  Headline: not knowing the fault magnitude costs at most 3.3 points of class-isolation
  accuracy and 0.0001 at the full window -- the composite-hypothesis rescue of AURA's
  motivation FAILS. But a prior that EXCLUDES the true magnitude costs 6.5-13.3 points
  and the penalty GROWS monotonically with observation length, which is the only effect
  measured anywhere in this project that worsens with more data.

  Three defects in our own design were found by testing and corrected. (1) A code bug
  excluded the nominal class F0 from the admissible set, which biased precisely the
  known-vs-unknown-magnitude comparison the experiment exists to make; the first run was
  discarded and the experiment re-run. (2) The pre-registered detectability floor is
  evaluated at the full window, so at short windows it conflates non-detection with
  mis-isolation; a window-local analysis was added post-hoc and labelled. (3) Case B as
  pre-registered measures prior MISSPECIFICATION rather than bounded knowledge, because
  truths span the full grid while the prior does not -- it was kept, reported
  prominently, and supplemented with an exploratory Case B-prime.

  Methodological note: the PRIMARY manifold measure is the continuous minimum over
  magnitude, not the grid minimum, because a discrete grid overstates near-intersection
  separation by up to 19.9x -- for exactly the pairs that matter.

  New threat recorded: TV-M6 (support misspecification).
