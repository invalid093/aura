experiment_id: EXP-0011
title: Fault-class isolation with unknown fault magnitude (composite hypotheses)
hypothesis: H2
purpose: >
  Relax EXP-0010's largest assumption. Treat fault magnitude as an unknown nuisance
  parameter and measure fault-CLASS isolation with magnitude marginalised out, to
  determine whether magnitude uncertainty creates the diagnostic ambiguity that
  measurement noise did not.
