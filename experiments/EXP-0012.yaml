experiment_id: EXP-0012
title: Unseen faults and hypothesis-space mismatch
hypothesis: H2
purpose: >
  Adversarial test of whether the physics-based diagnostic framework becomes
  CONFIDENTLY wrong when the true fault lies outside its hypothesis library, and
  whether any non-learning statistic already supplies the missing "none of the above"
  signal.
type: exploratory
status: COMPLETED
is_gate: true
gate_criterion: >
  Gate A (strong support) if a physically meaningful unseen fault produces high
  confidence in a wrong known fault with sufficient observable evidence, surviving the
  validity attacks. Gate D (negative) if the framework already indicates poor fit.
  Both were permitted; both are supported.
primary_metric: >
  FC(t) = P(posterior confidence >= 0.95) when no correct hypothesis exists, reported
  alongside the chi-square residual goodness-of-fit test. The two are reported
  SEPARATELY because they carry different information.
analysis_plan: experiments/EXP-0012/experiment_spec.md
configuration: experiments/EXP-0012/config/exp0012.yaml
configuration_sha256: null       # recorded in results/validation/EXP-0012/exp0012_results.json
git_commit: null                 # recorded in the results payload at run time
dataset_ids: [DS-0001, DS-0002, DS-0003]
random_seeds:
  base: 20261210
  policy: per-cell seeds derived deterministically by SHA-256 of (base, condition, window, fault, magnitude, eta)
parameters:
  flight_conditions: 4           # FC-4 excluded (FAIL-0001), not resurrected
  unseen_faults: 6
  magnitudes: 3
  observation_windows: 7
  noise_levels: 3
