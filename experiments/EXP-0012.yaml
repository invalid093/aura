storage_bytes: 6600000           # DS-0003, git-ignored
failure_ids: []
supersedes: null
superseded_by: null
notes: >
  DECISION GATE: A and D simultaneously. The framework catches 47-83% of
  hypothesis-space mismatch using a statistic it already computes (the chi-square
  residual), and does so exactly when a closed-form threshold predicts -- 1502 of 1512
  cells, 99.3%, from a prediction registered before the run and not refitted. But 5.8%
  of all cells, and 16.7% at full observation, are CONFIDENTLY WRONG with the residual
  silent. 23 cells remain so at the full 18 s window, covering all six unseen faults;
  12 of them diagnose a faulted aircraft as HEALTHY.

  Sharpest cases: a partially blocked pitot line is diagnosed as "no fault" with
  confidence rising from 0.133 to 0.993 as more data arrives (chi2 rejects 14%); a
  pitch-stability loss is diagnosed as an elevator-effectiveness loss at confidence
  1.0000 (chi2 rejects 2-5% for the first 2 s).

  Established analytically BEFORE running: the posterior is structurally incapable of
  expressing hypothesis-space mismatch, because a uniform misfit cancels in the
  softmax. Verified numerically (confidence 1.0000 unchanged while the residual rose
  2637 -> 7634). That is why the experiment was built around the residual rather than
  around the near-tautological "confidently wrong" result.

  Control: 56/56 known faults correct, normalised residual 1.000. Extending the shared
  simulation harness left all prior experiments bit-identical. Two pilot checks failed
  and both were bugs in the CHECKS, not the design.

  Recommendation: do NOT build an ML OOD detector. Most of the problem is already
  solved without learning; the residue is narrow and has not been shown beyond
  non-learning methods.
